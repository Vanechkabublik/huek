# Дополнение к docker-compose.prod.yml для сервера, где порты 80/443 уже заняты вашим nginx:
# приложение публикуется только на 127.0.0.1:8080, а Caddy не запускается.
#   docker compose -f docker-compose.prod.yml -f docker-compose.nginx.yml up -d --build app db
services:
  app:
    ports:
      - "127.0.0.1:8080:80"
