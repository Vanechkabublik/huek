# Боевой запуск за HTTPS (Caddy + автоматический сертификат Let's Encrypt):
#   cp .env.prod.example .env   # заполните DOMAIN, ACME_EMAIL, DB_PASS, APP_SECRET
#   docker compose -f docker-compose.prod.yml up -d --build
# Наружу открыты только порты 80 и 443 (Caddy). Приложение, WebSocket и БД снаружи недоступны.
x-app-env: &app-env
  DB_HOST: db
  DB_NAME: ${DB_NAME:-ads}
  DB_USER: ${DB_USER:-ads_user}
  DB_PASS: ${DB_PASS:?Укажите DB_PASS в .env}
  APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
  APP_DEBUG: "0"
  APP_DEMO: ${APP_DEMO:-0}
  APP_SECRET: ${APP_SECRET:-}
  APP_URL: ${APP_URL:-https://${DOMAIN:-localhost}}
  YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
  YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GEOCODER_URL: ${GEOCODER_URL:-}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  TURN_SECRET: ${TURN_SECRET:-}               # звонки: общий секрет с coturn (временные логины TURN для браузеров)
  TURN_HOST: ${TURN_HOST:-}                   # пусто — берётся домен из APP_URL
  TURN_PORT: ${TURN_PORT:-3478}
  CALLS_RELAY_ONLY: ${CALLS_RELAY_ONLY:-}     # 1 — все звонки через сервер: собеседники не видят IP друг друга
  WS_PORT: "8081"
  WS_PUBLIC_URL: ${WS_PUBLIC_URL:-}

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"             # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?Укажите DOMAIN в .env}
      ACME_EMAIL: ${ACME_EMAIL:?Укажите ACME_EMAIL в .env}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # сертификаты — не удаляйте том, иначе Let's Encrypt выдаст их заново (есть лимиты)
      - caddy_config:/config
    depends_on:
      - app
      - ws

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile      # для высокой нагрузки: docker/php/apache/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./:/var/www/html
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  # TURN-сервер для звонков: ретранслирует звук и видео, когда прямое соединение между браузерами невозможно
  # (мобильные сети, строгий NAT — около каждого пятого звонка). Работает в сети хоста: Docker NAT ломает диапазон
  # портов ретрансляции. В брандмауэре сервера (и у хостинга) нужны: 3478 UDP и TCP, TURN_MIN_PORT–TURN_MAX_PORT UDP.
  # Секрет общий с приложением (TURN_SECRET); внутренние адреса (10.x, 192.168.x, 127.x…) через TURN недоступны.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_REALM: ${DOMAIN:-board.local}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49200}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -n "$$TURN_SECRET" ] || { echo "TURN_SECRET не задан в .env — звонки через сервер не заработают"; exit 1; }
        DENY=""
        for r in 0.0.0.0-0.255.255.255 10.0.0.0-10.255.255.255 100.64.0.0-100.127.255.255 127.0.0.0-127.255.255.255 \
                 169.254.0.0-169.254.255.255 172.16.0.0-172.31.255.255 192.0.0.0-192.0.0.255 192.168.0.0-192.168.255.255 \
                 198.18.0.0-198.19.255.255 240.0.0.0-255.255.255.255; do DENY="$$DENY --denied-peer-ip=$$r"; done
        EXT=""; [ -n "$$TURN_EXTERNAL_IP" ] && EXT="--external-ip=$$TURN_EXTERNAL_IP"
        exec turnserver -n --log-file=stdout --simple-log --no-software-attribute \
          --realm="$$TURN_REALM" --use-auth-secret --static-auth-secret="$$TURN_SECRET" \
          --listening-port="$$TURN_PORT" --min-port="$$TURN_MIN_PORT" --max-port="$$TURN_MAX_PORT" \
          --fingerprint --stale-nonce --no-cli --no-tls --no-dtls --no-multicast-peers --no-tcp-relay \
          --user-quota=12 --total-quota=300 $$EXT $$DENY

  # WebSocket чата: Caddy / nginx проксируют на него путь /ws
  ws:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: ["php", "bin/ws-server.php"]
    expose:
      - "8081"
    volumes:
      - ./:/var/www/html
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8081/health') === 'ok' ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ads}
      POSTGRES_USER: ${DB_USER:-ads_user}
      POSTGRES_PASSWORD: ${DB_PASS:?Укажите DB_PASS в .env}
      TZ: ${APP_TIMEZONE:-Europe/Moscow}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  pg_data:
  caddy_data:
  caddy_config:
