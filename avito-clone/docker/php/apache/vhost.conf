<VirtualHost *:80>
    ServerName localhost
    # Наружу смотрит только public/: src/, templates/, docker/ и .env недоступны по HTTP
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # В папке загрузок PHP никогда не исполняется — даже если туда попадёт «php-файл»
    <Directory /var/www/html/public/uploads>
        php_admin_flag engine off
        RemoveHandler .php .phtml .phar
        <FilesMatch "(?i)\.(php|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    # Статика кэшируется (в шаблонах к css/js добавляется ?v=<mtime>, поэтому обновление мгновенное)
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css "access plus 7 days"
        ExpiresByType application/javascript "access plus 7 days"
        ExpiresByType image/jpeg "access plus 30 days"
        ExpiresByType image/svg+xml "access plus 30 days"
        ExpiresByType video/mp4 "access plus 30 days"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
