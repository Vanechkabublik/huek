# Боевой запуск за HTTPS (Caddy + автоматический сертификат Let's Encrypt):
#   cp .env.prod.example .env   # заполните DOMAIN, ACME_EMAIL, DB_PASS, APP_SECRET
#   docker compose -f docker-compose.prod.yml up -d --build
# Наружу открыты только порты 80 и 443 (Caddy). Приложение, WebSocket и БД снаружи недоступны.
x-app-env: &app-env
  DB_HOST: db
  DB_NAME: ${DB_NAME:-ads}
  DB_USER: ${DB_USER:-ads_user}
  DB_PASS: ${DB_PASS:?Укажите DB_PASS в .env}
  APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
  APP_DEBUG: "0"
  APP_DEMO: ${APP_DEMO:-0}
  APP_SECRET: ${APP_SECRET:-}
  APP_URL: ${APP_URL:-https://${DOMAIN:-localhost}}
  YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
  YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  WS_PORT: "8081"
  WS_PUBLIC_URL: ${WS_PUBLIC_URL:-}

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"             # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?Укажите DOMAIN в .env}
      ACME_EMAIL: ${ACME_EMAIL:?Укажите ACME_EMAIL в .env}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # сертификаты — не удаляйте том, иначе Let's Encrypt выдаст их заново (есть лимиты)
      - caddy_config:/config
    depends_on:
      - app
      - ws

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile      # для высокой нагрузки: docker/php/apache/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./:/var/www/html
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  # WebSocket чата: Caddy / nginx проксируют на него путь /ws
  ws:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: ["php", "bin/ws-server.php"]
    expose:
      - "8081"
    volumes:
      - ./:/var/www/html
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8081/health') === 'ok' ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ads}
      POSTGRES_USER: ${DB_USER:-ads_user}
      POSTGRES_PASSWORD: ${DB_PASS:?Укажите DB_PASS в .env}
      TZ: ${APP_TIMEZONE:-Europe/Moscow}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  pg_data:
  caddy_data:
  caddy_config:
